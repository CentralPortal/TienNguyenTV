                    { t: "MÓN QUÀ BẤT NGỜ: Ân nhân giấu mặt hỗ trợ chữa bệnh cho bé trai", t1: "ÂN NHÂN GIẤU MẶT", t2: "HỖ TRỢ CHỮA BỆNH" },
                    { t: "CÂY CẦU DÂN TRÍ: Khai trương cầu bê tông thay thế dây cáp hiểm trở", t1: "CẦU BÊ TÔNG MỚI", t2: "THAY DÂY CÁP" },
                    { t: "NƯỚC MẮT NGHẸN NGÀO khi nhận được thẻ bảo hiểm y tế miễn phí", t1: "THẺ BẢO HIỂM 0 ĐỒNG", t2: "NƯỚC MẮT NGHẸN NGÀO" },
                    { t: "TẶNG MÁY BƠM NƯỚC: Niềm vui của cụ bà góa cả đời gùi nước suối", t1: "TẶNG MÁY BƠM", t2: "HẾT GÙI NƯỚC SUỐI" },
                    { t: "ẤM ÁP TÌNH NGƯỜI: Mang quần áo mùa đông đến tận tay bà con", t1: "ÁO ẤM MÙA ĐÔNG", t2: "ẤM ÁP TÌNH NGƯỜI" },
                    { t: "KẾT THÚC CẢNH ĐÓI: Tặng hũ gạo tình thương đủ ăn cả năm", t1: "HŨ GẠO TÌNH THƯƠNG", t2: "HẾT CẢNH ĐÓI" },
                    { t: "TẶNG BÌNH ẮC QUY SẠC ĐIỆN: Lần đầu gia đình có quạt mát mùa hè", t1: "BÌNH ẮC QUY MỚI", t2: "LẦN ĐẦU CÓ QUẠT" },
                    { t: "MÓN QUÀ THÁNG 12: Tặng chăn đệm sưởi ấm cho các cụ già neo đơn", t1: "TẶNG CHĂN ĐỆM", t2: "SƯỞI ẤM ĐÊM ĐÔNG" },
                    { t: "CUỘC SỐNG SANG TRANG MỚI: Tặng 100 triệu mua đất làm nhà cho 3 mẹ con", t1: "TẶNG 100 TRIỆU", t2: "MUA ĐẤT XÂY NHÀ" },
                    { t: "BẤT NGỜ TRÚNG 'SỐ VÀNG': Nhà tài trợ nuôi 2 cháu mồ côi ăn học đại học", t1: "NUÔI HỌC ĐẠI HỌC", t2: "2 CHÁU MỒ CÔI" },
                    { t: "HÀNH TRÌNH TỬ TẾ: Vượt 500km mang yêu thương tới đồng bào miền núi", t1: "VƯỢT 500KM", t2: "MANG YÊU THƯƠNG" },
                    { t: "NỤ CƯỜI TRẺ THƠ: Ngày hội cắt tóc và phát kẹo miễn phí vùng cao", t1: "CẮT TÓC 0 ĐỒNG", t2: "NỤ CƯỜI TRẺ THƠ" },
                    { t: "MÁI TÓC TÌNH NGHĨA: Trao tặng xe lăn điện cho bác cựu chiến binh", t1: "TẶNG XE LĂN ĐIỆN", t2: "CỰU CHIẾN BINH" },
                    { t: "ĐIỂM TỰA MỚI: Tặng xưởng may nhỏ cho cô gái khuyết tật vươn lên", t1: "TẶNG XƯỞNG MAY", t2: "GÁI KHUYẾT TẬT" },
                    { t: "TRÁI TIM NHÂN ÁI: Mang mùa xuân ấm áp về vùng biên giới nghèo", t1: "MANG XUÂN VỀ BẢN", t2: "TRÁI TIM NHÂN ÁI" },
                    { t: "MỚI TIN LÀ THẬT: Cụ già 90 tuổi ôm lấy đoàn từ thiện bật khóc", t1: "CỤ 90 BẬT KHÓC", t2: "MỚI TIN LÀ THẬT" },
                    { t: "GIỌT NƯỚC MẮT TRI ÂN của cậu học sinh nghèo đậu thủ khoa", t1: "ĐẬU THỦ KHOA", t2: "GIỌT NƯỚC MẮT TRI ÂN" },
                    { t: "XÂY DỰNG TƯƠNG LAI: Bàn giao tủ sách cộng đồng cho trẻ em núi", t1: "TỦ SÁCH CỘNG ĐỒNG", t2: "MỞ RA TƯƠNG LAI" },
                    { t: "TRAO TẶNG GÀ GIỐNG: Mô hình phát triển kinh tế cho 20 hộ nghèo", t1: "TẶNG GÀ GIỐNG", t2: "THOÁT NGHÈO BỀN VƯỜNG" },
                    { t: "NIỀM VUI MÙA THUÔN: Lần đầu tiên bản nghèo được chiếu phim lưu động", t1: "CHIẾU PHIM 0 ĐỒNG", t2: "NIỀM VUI BẢN LÀNG" },
                    { t: "BẤT NGỜ LỚN NHẤT ĐỜI: Tặng sổ tiết kiệm chữa bệnh cho người mẹ nghèo", t1: "SỔ TIẾT KIỆM CHỮA BỆNH", t2: "MÓN QUÀ VÔ GIÁ" },
                    { t: "HẠNH PHÚC TRỌN VẸN: Lễ bàn giao công trình nước sạch và nhà tình thương", t1: "NHÀ MỚI NƯỚC SẠCH", t2: "HẠNH PHÚC TRỌN VẸN" }
                ]
            }
        ];

        /* Helper Functions */
        function getTitleId(catId, index) {
            return `${catId}_title_${index}`;
        }

        function renderTitleItems(cat) {
            return cat.titles.map((item, idx) => {
                const titleText = typeof item === 'string' ? item : item.t;
                const thumb1 = (typeof item === 'object' && item.t1) ? item.t1 : 'NỔI BẬT';
                const thumb2 = (typeof item === 'object' && item.t2) ? item.t2 : 'XÓT XA';
                const titleId = getTitleId(cat.id, idx);
                const isChecked = !!checkedMap[titleId];
                const titleNumber = idx + 1;

                return `
                    <div id="item_wrapper_${titleId}" class="flex flex-col sm:flex-row sm:items-center gap-3 p-3.5 rounded-xl bg-white dark:bg-slate-900 border border-slate-200/80 dark:border-slate-800 transition hover:border-slate-300 dark:hover:border-slate-700">
                        <div class="flex items-start sm:items-center gap-3 flex-1 min-w-0">
                            <!-- Title Sequence Number -->
                            <span class="text-xs sm:text-sm font-bold text-slate-400 dark:text-slate-500 min-w-[28px] text-right shrink-0 select-none font-mono">
                                ${titleNumber}.
                            </span>
                            <input type="checkbox" 
                                   id="${titleId}" 
                                   ${isChecked ? 'checked' : ''} 
                                   onchange="toggleCheck('${titleId}')"
                                   class="w-5 h-5 mt-0.5 sm:mt-0 rounded border-slate-300 text-red-600 focus:ring-red-500 cursor-pointer shrink-0 transition">
                            <div class="flex-1 min-w-0">
                                <label for="${titleId}" 
                                       id="label_${titleId}" 
                                       class="text-sm sm:text-base font-medium select-none cursor-pointer block leading-snug transition ${isChecked ? 'line-through text-slate-400 dark:text-slate-500' : 'text-slate-800 dark:text-slate-200'}">
                                    ${titleText}
                                </label>
                                <!-- Thumbnail Text Badges -->
                                <div class="mt-2 flex flex-wrap items-center gap-1.5 text-xs select-none">
                                    <span class="text-slate-400 dark:text-slate-500 font-medium text-[11px] mr-0.5">
                                        <i class="fa-solid fa-image text-[10px] mr-1 opacity-70"></i>Chữ Ảnh thu nhỏ:
                                    </span>
                                    <span class="inline-flex items-center px-2 py-0.5 rounded-md bg-amber-100 text-amber-900 dark:bg-amber-950/80 dark:text-amber-200 font-bold tracking-wide uppercase text-[11px] border border-amber-300/80 dark:border-amber-700/60 shadow-2xs">
                                        ${thumb1}
                                    </span>
                                    <span class="text-slate-300 dark:text-slate-700 text-xs">+</span>
                                    <span class="inline-flex items-center px-2 py-0.5 rounded-md bg-red-100 text-red-900 dark:bg-red-950/80 dark:text-red-200 font-bold tracking-wide uppercase text-[11px] border border-red-300/80 dark:border-red-700/60 shadow-2xs">
                                        ${thumb2}
                                    </span>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function toggleCheck(titleId) {
            const checkbox = document.getElementById(titleId);
            const label = document.getElementById(`label_${titleId}`);
            if (checkbox && label) {
                if (checkbox.checked) {
                    checkedMap[titleId] = true;
                    label.classList.add('line-through', 'text-slate-400', 'dark:text-slate-500');
                    label.classList.remove('text-slate-800', 'dark:text-slate-200');
                } else {
                    delete checkedMap[titleId];
                    label.classList.remove('line-through', 'text-slate-400', 'dark:text-slate-500');
                    label.classList.add('text-slate-800', 'dark:text-slate-200');
                }
                saveState();
            }
        }

        function loadState() {
            try {
                const saved = localStorage.getItem(STORAGE_KEY);
                if (saved) {
                    checkedMap = JSON.parse(saved);
                }
            } catch (e) {
                console.error('Failed to load state', e);
            }
        }

        function saveState() {
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(checkedMap));
            } catch (e) {
                console.error('Failed to save state', e);
            }
        }

        function toggleCategory(catId) {
            const content = document.getElementById(`content_${catId}`);
            const chevron = document.getElementById(`icon_chevron_${catId}`);
            if (!content || !chevron) return;

            if (content.style.maxHeight && content.style.maxHeight !== '0px') {
                content.style.maxHeight = '0px';
                content.style.opacity = '0';
                chevron.style.transform = 'rotate(0deg)';
            } else {
                content.style.maxHeight = content.scrollHeight + 'px';
                content.style.opacity = '1';
                chevron.style.transform = 'rotate(180deg)';
            }
        }

        function renderCategories() {
            const container = document.getElementById('categoriesContainer');
            if (!container) return;
            container.innerHTML = '';

            categoriesData.forEach((cat) => {
                const catCard = document.createElement('div');
                catCard.className = 'bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl overflow-hidden shadow-sm transition-all hover:border-slate-300 dark:hover:border-slate-700';
                catCard.id = `card_${cat.id}`;

                catCard.innerHTML = `
                    <!-- Accordion Header -->
                    <div class="p-4 flex items-center justify-between cursor-pointer select-none gap-3 bg-white dark:bg-slate-900 hover:bg-slate-50 dark:hover:bg-slate-800/60 transition"
                         onclick="toggleCategory('${cat.id}')">
                        <div class="flex items-center space-x-3.5 flex-1 min-w-0">
                            <div class="w-10 h-10 rounded-xl ${cat.bgColor} ${cat.color} border ${cat.borderColor} flex items-center justify-center text-lg shrink-0 shadow-xs">
                                <i class="fa-solid ${cat.icon}"></i>
                            </div>
                            <div class="min-w-0 flex-1">
                                <div class="flex items-center gap-2 flex-wrap">
                                    <h2 class="text-base sm:text-lg font-bold text-slate-900 dark:text-white tracking-wide truncate">${cat.title}</h2>
                                    <span class="px-2 py-0.5 text-xs font-medium rounded-full bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-400 border border-slate-200 dark:border-slate-700 shrink-0">
                                        ${cat.titles.length} tiêu đề
                                    </span>
                                </div>
                                <p class="text-xs text-slate-500 dark:text-slate-400 mt-0.5 truncate">${cat.desc}</p>
                            </div>
                        </div>

                        <!-- Collapsible Chevron Button -->
                        <div id="icon_chevron_${cat.id}" class="w-7 h-7 rounded-lg bg-slate-100 dark:bg-slate-800 flex items-center justify-center text-slate-500 dark:text-slate-400 transition-transform duration-300 shrink-0">
                            <i class="fa-solid fa-chevron-down text-xs"></i>
                        </div>
                    </div>

                    <!-- Accordion Content Body -->
                    <div id="content_${cat.id}" class="accordion-content border-t border-slate-100 dark:border-slate-800/80 bg-slate-50/60 dark:bg-slate-950/40">
                        <div class="p-3.5 sm:p-4 space-y-2" id="list_${cat.id}">
                            ${renderTitleItems(cat)}
                        </div>
                    </div>
                `;

                container.appendChild(catCard);
            });
        }

        function collapseAll() {
            categoriesData.forEach(cat => {
                const content = document.getElementById(`content_${cat.id}`);
                const chevron = document.getElementById(`icon_chevron_${cat.id}`);
                if (content) {
                    content.style.maxHeight = '0px';
                    content.style.opacity = '0';
                }
                if (chevron) {
                    chevron.style.transform = 'rotate(0deg)';
                }
            });
        }

        function openResetModal() {
            const modal = document.getElementById('resetModal');
            if (modal) modal.classList.remove('hidden');
        }

        function closeResetModal() {
            const modal = document.getElementById('resetModal');
            if (modal) modal.classList.hidden = true;
            if (modal) modal.classList.add('hidden');
        }

        function executeResetAll() {
            checkedMap = {};
            saveState();
            renderCategories();
            collapseAll();
            closeResetModal();
            showToast('Đã đặt lại tất cả tiêu đề thành công!');
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            const toastMsg = document.getElementById('toastMsg');
            if (toast && toastMsg) {
                toastMsg.textContent = msg;
                toast.classList.remove('translate-y-20', 'opacity-0');
                toast.classList.add('translate-y-0', 'opacity-100');

                setTimeout(() => {
                    toast.classList.remove('translate-y-0', 'opacity-100');
                    toast.classList.add('translate-y-20', 'opacity-0');
                }, 2500);
            }
        }

        /* Initial Loading Event */
        window.addEventListener('DOMContentLoaded', () => {
            initTheme();
            loadState();
            renderCategories();
            collapseAll();
        });
    </script>
</body>
</html>
